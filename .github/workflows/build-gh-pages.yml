name: Build GH Pages

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Zola
        env:
          ZOLA_VERSION: 0.23.6
          ZOLA_SHA256: 7d77a4220a4f699cba2fc0e0c7859f780e887e269159ad4fab90e11ea16c906f
        run: |
          curl --fail --location --retry 3 "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o "$RUNNER_TEMP/zola.tar.gz"
          echo "$ZOLA_SHA256  $RUNNER_TEMP/zola.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/zola.tar.gz" -C "$RUNNER_TEMP" zola
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check and Build
        run: |
          zola --version
          zola check --skip-external-links
          zola build
          python3 scripts/check_build.py
          python3 scripts/check_templates.py
      - name: Upload Site
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: site
          path: public/

  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Download Site
        uses: actions/download-artifact@v8.0.2
        with:
          name: site
          path: public/
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          publish_branch: gh-pages
