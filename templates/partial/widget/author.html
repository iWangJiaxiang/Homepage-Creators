{# name #}
{# title #}
{# avatar #}
{# bio #}
{% component site.author(config, i18n, value) %}
<div class="avatar-discription">
    <span class="avatar-discription-text">
      <p>
        {{ value.bio | safe }}
      </p>
    </span>
    <div class="avatar-info">
      {{<site.img_progressive_loading_single_size config i18n src={value.avatar} class={"avatar-image"} />}}
      <span class="avatar-name">{{ value.name }}</span>
      <span class="avatar-title">{{ value.title }}</span>
    </div>
  </div>
{% endcomponent %}
